# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: |
          python-ai/requirements-core.txt
          python-ai/requirements-runtime.txt
          python-ai/requirements-test.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python-ai/requirements-core.txt
        pip install -r python-ai/requirements-test.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 python-ai/boardsight_ai python-ai/tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 python-ai/boardsight_ai python-ai/tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest python-ai/tests
    - name: Check browser JavaScript syntax
      run: node --check java-app/src/main/resources/public/app.js
